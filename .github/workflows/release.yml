name: Build and Release MLOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build kernel, package ISO and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y grub-common grub-pc-bin xorriso mtools

      - name: Install Rust 1.93.0 with rust-src
        run: |
          rustup toolchain install 1.93.0 --profile minimal --component rust-src
          rustup default 1.93.0
          rustc --version
          cargo --version

      - name: Build MLOS kernel
        run: |
          set +e
          RUSTC_BOOTSTRAP=1 cargo build --release > /tmp/build.log 2>&1
          EC=$?
          echo "cargo build exit code: $EC"
          cat /tmp/build.log
          {
            echo "### Build log (exit $EC)"
            echo '```text'
            cat /tmp/build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $EC

      - name: Package bootable ISO
        run: |
          mkdir -p iso/boot/grub
          cp target/x86_64-os/release/mlos iso/boot/mlos.bin
          cp grub.cfg iso/boot/grub/grub.cfg
          grub-mkrescue -o MLOS.iso iso
          ls -lh MLOS.iso

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: MLOS v1.0.2
          body: |
            ## MLOS v1.0.2 - Minimal Light Operating System

            MLOS is a small 64-bit operating system written from scratch in Rust, delivered as a bootable ISO image.

            ### New in v1.0.2
            - **Performance monitor** (`perf`): CPU status (vendor via CPUID, TSC frequency calibrated against the PIT), memory usage, disk usage
            - **File browser** (`ls` / `cat` / `write` / `rm`): MiniFS file store on raw disk sectors — browse, read and edit files on the hard disk
            - English-only UI (dual-render / CJK support removed for a leaner kernel)

            ### Core features
            - no_std bare-metal kernel, Multiboot2 + GRUB 2 boot, 32→64-bit long mode switch
            - PS/2 keyboard, VGA text display, memory detection
            - First-boot setup wizard: username & password (FNV-1a hashed)
            - ATA PIO disk driver; user config persisted to disk
            - Online update check (`update`), games (Number Bomb / Guess Number / RPS), tools (calc / base / prime / hash / rand / ascii)

            ### Download
            - `MLOS.iso` - bootable ISO image (BIOS mode)

            ### Run
            ```bash
            qemu-img create -f raw mlos-disk.img 16M
            qemu-system-x86_64 -cdrom MLOS.iso -m 128M -boot d -net none \
              -drive file=mlos-disk.img,format=raw,if=ide,index=0,media=disk
            ```
            First boot runs the setup wizard; after login try `perf`, `ls`, and `update`.

            > Developer: MEME-LMXDG · Uses GRUB i386-pc, BIOS boot required (not pure UEFI).
          files: MLOS.iso
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
